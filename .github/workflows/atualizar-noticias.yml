name: Atualizar notícias filtradas

on:
  schedule:
    # Roda todo dia às 09:00 UTC (06:00 horário de Brasília)
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" no GitHub
  push:
    paths:
      - "entrada_manual.html"   # dispara assim que você colar conteúdo manual e salvar

permissions:
  contents: write
  issues: write   # necessário para o robô poder criar os avisos (bloqueio / volume)
  pages: write    # necessário para publicar o site no GitHub Pages
  id-token: write # exigido pelo passo de publicação do GitHub Pages

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 deep-translator

      - name: Rodar script de monitoramento
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor_noticias.py

      - name: Publicar mudanças (docs/noticias.json)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/noticias.json entrada_manual.html
          git diff --quiet --cached || git commit -m "Atualiza noticias.json [automático]"
          git push

      - name: Preparar publicação do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
